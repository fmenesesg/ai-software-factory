[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-software-factory"
version = "0.4.0"
description = "AI Software Factory monorepo packages (agent-sdk, inference-gateway, orchestrator, mcp, agents)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pydantic>=2",
  "pydantic-settings>=2",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary]>=3.2",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = [
  "packages/agent-sdk/src",
  "packages/inference-gateway/src",
  "packages/orchestrator/src",
  "mcp/git/src",
  "mcp/github/src",
  "mcp/filesystem/src",
  "mcp/openshift/src",
  "mcp/kubernetes/src",
  "agents/pm/src",
  "agents/architect/src",
  "agents/developer/src",
  "agents/reviewer/src",
  "agents/security/src",
  "agents/qa/src",
  "platform/pipelines/src",
  "platform/gitops/src",
  "sample-app/backend/src",
]

[tool.pytest.ini_options]
pythonpath = [
  "packages/agent-sdk/src",
  "packages/inference-gateway/src",
  "packages/orchestrator/src",
  "mcp/git/src",
  "mcp/github/src",
  "mcp/filesystem/src",
  "mcp/openshift/src",
  "mcp/kubernetes/src",
  "agents/pm/src",
  "agents/architect/src",
  "agents/developer/src",
  "agents/reviewer/src",
  "agents/security/src",
  "agents/qa/src",
  "platform/pipelines/src",
  "platform/gitops/src",
  "sample-app/backend/src",
]
testpaths = [
  "packages",
  "mcp/git",
  "mcp/github",
  "mcp/filesystem",
  "mcp/openshift",
  "mcp/kubernetes",
  "agents/pm",
  "agents/architect",
  "agents/developer",
  "agents/reviewer",
  "agents/security",
  "agents/qa",
  "platform/pipelines",
  "platform/gitops",
  "sample-app/backend",
  "scripts/tests",
]
addopts = "-q"
