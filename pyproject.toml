[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-software-factory"
version = "0.1.0"
description = "AI Software Factory monorepo packages (agent-sdk, inference-gateway, orchestrator)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "pydantic>=2",
  "pydantic-settings>=2",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = [
  "packages/agent-sdk/src",
  "packages/inference-gateway/src",
  "packages/orchestrator/src",
]

[tool.pytest.ini_options]
pythonpath = [
  "packages/agent-sdk/src",
  "packages/inference-gateway/src",
  "packages/orchestrator/src",
]
testpaths = ["packages"]
addopts = "-q"
