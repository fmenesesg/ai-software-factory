<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orders &amp; Inventory</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>Orders &amp; Inventory</h1>
      <p class="lede">Demo storefront for the AI Software Factory sample-app.</p>
      <section>
        <h2>Inventory</h2>
        <ul id="inventory"></ul>
      </section>
      <section>
        <h2>Place order</h2>
        <form id="order-form">
          <label>
            SKU
            <select id="sku" name="sku" required></select>
          </label>
          <label>
            Quantity
            <input id="quantity" name="quantity" type="number" min="1" value="1" required />
          </label>
          <button type="submit">Submit</button>
        </form>
        <p id="message" role="status"></p>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
