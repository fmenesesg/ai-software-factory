replicaCount: 1

image:
  repository: ghcr.io/fmenesesg/ai-software-factory-sample-app
  tag: "0.3.0"
  pullPolicy: IfNotPresent
  digest: ""

service:
  type: ClusterIP
  port: 8080

probes:
  livenessPath: /health
  readinessPath: /ready
  initialDelaySeconds: 5
  periodSeconds: 10

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

persistence:
  # SQLite demo volume (emptyDir). Document Postgres for production-shaped workshops later.
  enabled: true
  mountPath: /opt/app/data

route:
  # OpenShift Route when available; Ingress annotation alternative for plain K8s.
  enabled: true
  host: ""

fullnamePrefix: asf-workshop-
