# HTTPRoute for Tekton Dashboard (release-full installs Deployment into tekton-pipelines).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tekton-dashboard
  namespace: tekton-pipelines
  labels:
    app.kubernetes.io/part-of: ai-software-factory
spec:
  parentRefs:
    - name: asf
      namespace: gateway-system
      sectionName: http-star
  hostnames:
    - tekton.asf.demo.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: tekton-dashboard
          port: 9097
