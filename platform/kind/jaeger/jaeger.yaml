# Jaeger 2 all-in-one (Apache-2.0) — official image, native OTLP.
# UI: http://jaeger.asf.demo.local:8080/
# Agents → OTel collector → Jaeger OTLP (no custom exporters).
apiVersion: v1
kind: Namespace
metadata:
  name: asf-observability
  labels:
    app.kubernetes.io/part-of: ai-software-factory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: asf-observability
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: ai-software-factory
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      containers:
        - name: jaeger
          image: docker.io/jaegertracing/jaeger:2.22.0
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          readinessProbe:
            httpGet:
              path: /
              port: ui
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: asf-observability
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: ui
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jaeger
  namespace: asf-observability
  labels:
    app.kubernetes.io/part-of: ai-software-factory
spec:
  parentRefs:
    - name: asf
      namespace: gateway-system
      sectionName: http-star
  hostnames:
    - jaeger.asf.demo.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jaeger
          port: 16686
