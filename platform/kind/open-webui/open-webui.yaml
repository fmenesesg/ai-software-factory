# Open WebUI → factory inference gateway (OpenAI-compatible stub or Ollama via gateway).
apiVersion: v1
kind: Namespace
metadata:
  name: asf-chat
  labels:
    app.kubernetes.io/part-of: ai-software-factory
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: asf-chat
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/part-of: ai-software-factory
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
    spec:
      containers:
        - name: web
          image: ghcr.io/open-webui/open-webui:v0.11.4
          env:
            - name: WEBUI_AUTH
              value: "false"
            - name: ENABLE_OLLAMA_API
              value: "false"
            - name: OPENAI_API_BASE_URL
              value: http://asf-inference-gateway.asf-factory.svc:8081/v1
            - name: OPENAI_API_KEY
              value: kind-local-unused
            - name: WEBUI_NAME
              value: ASF Inference
            - name: DEFAULT_MODELS
              value: stub-small-model
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: asf-chat
spec:
  selector:
    app.kubernetes.io/name: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  namespace: asf-chat
spec:
  parentRefs:
    - name: asf
      namespace: gateway-system
      sectionName: http-star
  hostnames:
    - chat.asf.demo.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: open-webui
          port: 8080
