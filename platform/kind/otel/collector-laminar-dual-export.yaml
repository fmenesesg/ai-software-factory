# Spike overlay: dual-export OTLP → Jaeger + host Laminar (no agent changes).
# Prerequisites: Laminar compose on host + Secret otel-laminar-apikey.
# Docs: docs/workshop/laminar-spike.md
#
#   kubectl -n asf-observability create secret generic otel-laminar-apikey \
#     --from-literal=project-api-key="$LAMINAR_PROJECT_API_KEY"
#   kubectl apply -f platform/kind/otel/collector-laminar-dual-export.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: asf-observability
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
    processors:
      batch:
        timeout: 2s
        send_batch_size: 64
    exporters:
      debug:
        verbosity: basic
      otlp/jaeger:
        endpoint: jaeger:4317
        tls:
          insecure: true
      otlphttp/laminar:
        endpoint: http://host.containers.internal:8000
        headers:
          Authorization: "Bearer ${env:LAMINAR_PROJECT_API_KEY}"
        tls:
          insecure: true
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug, otlp/jaeger, otlphttp/laminar]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: asf-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      # Kind node resolves host.containers.internal; pods need hostAliases (podman).
      hostAliases:
        - ip: "169.254.1.2"
          hostnames:
            - host.containers.internal
            - host.docker.internal
      containers:
        - name: collector
          image: docker.io/otel/opentelemetry-collector-contrib:0.162.0
          args: ["--config=/conf/config.yaml"]
          env:
            - name: LAMINAR_PROJECT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: otel-laminar-apikey
                  key: project-api-key
          volumeMounts:
            - name: config
              mountPath: /conf
          ports:
            - containerPort: 4317
              name: grpc
            - containerPort: 4318
              name: http
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: asf-observability
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: grpc
      port: 4317
      targetPort: grpc
    - name: http
      port: 4318
      targetPort: http
