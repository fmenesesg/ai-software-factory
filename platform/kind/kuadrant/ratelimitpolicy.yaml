# Optional — NOT applied by kind-up by default (gateway-only for now).
# Apply later when you want a RateLimit wow: kubectl apply -f this file.
---
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: asf-gateway-rlp
  namespace: gateway-system
  labels:
    asf.demo: ratelimit
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: asf
  limits:
    "demo-wow":
      rates:
        - limit: 5
          window: 10s
