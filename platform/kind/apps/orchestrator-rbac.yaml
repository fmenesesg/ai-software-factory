# Allow orchestrator (default SA) to create Tekton PipelineRuns in asf-factory.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: asf-orchestrator-tekton
  namespace: asf-factory
  labels:
    app.kubernetes.io/part-of: ai-software-factory
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "taskruns", "pipelines", "tasks"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces", "services", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: asf-orchestrator-tekton
  namespace: asf-factory
  labels:
    app.kubernetes.io/part-of: ai-software-factory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: asf-orchestrator-tekton
subjects:
  - kind: ServiceAccount
    name: default
    namespace: asf-factory
