apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: asf-factory
  labels:
    app.kubernetes.io/name: sample-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sample-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-app
    spec:
      containers:
        - name: app
          image: localhost/asf-sample-app:kind
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: sample-app
  namespace: asf-factory
spec:
  selector:
    app.kubernetes.io/name: sample-app
  ports:
    - name: http
      port: 8080
      targetPort: http
