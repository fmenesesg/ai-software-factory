# PROFILE=kind-oss — laptop Kind + OSS (no paid RH products)
profile: kind-oss
description: >
  Single Kind cluster (asf-kind) with Envoy Gateway + Kuadrant (KCD BA N-S pattern),
  full agent set when RAM allows, Ollama small models on host, Langfuse viz.
  Not Contour; not MetalLB; not OpenShift AI / RHDH / RHACS products.

components:
  orchestrator: true
  inference_gateway: true
  observability_otel: true
  langfuse: true
  agents:
    pm: true
    architect: true
    developer: true
    reviewer: true
    security: true
    qa: true
    documentation: true
    deployment: true
    sre: true
  mcp:
    github: true
    filesystem: true
    git: true
    openshift: false          # use kubernetes + Gateway HTTPRoute
    kubernetes: true
    developer_hub: false    # RHDH product out; Langfuse covers agent viz
  pipelines_tekton: true
  ephemeral_namespaces: true
  gitops_promote_hitl: true
  rhdh_component: false
  ghcr_publish: true          # or kind load for air-gapped
  live_granite: false         # host Ollama / small open-weight models
  ollama_host: true
  kuadrant_gateway: true
  envoy_gateway: true
  rhacs: false
  quay: false

edge:
  provider: envoy-gateway
  policies: kuadrant
  loadbalancer: cloud-provider-kind
  cluster_name: asf-kind
  hostname: asf.demo.local
  listener_port: 8080

inference:
  default_url: http://host.containers.internal:11434/v1
  model_id: granite-3.1-2b-instruct   # override with any small Ollama tag
  stub_mode: false
