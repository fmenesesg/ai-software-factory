apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: sample-app-deploy-ephemeral
  labels:
    app.kubernetes.io/part-of: ai-software-factory
spec:
  description: >
    Deploy sample-app Helm chart into a NAMESPACE_PREFIX-scoped ephemeral namespace
    and emit URL + namespace evidence for the PR comment/Check.
  params:
    - name: IMAGE
      type: string
    - name: IMAGE_DIGEST
      type: string
      description: sha256 digest from build-test-push
    - name: NAMESPACE
      type: string
      description: Ephemeral namespace (must start with NAMESPACE_PREFIX)
    - name: NAMESPACE_PREFIX
      type: string
      default: asf-workshop-
    - name: RELEASE_NAME
      type: string
      default: sample-app
    - name: PR_NUMBER
      type: string
      default: "0"
  results:
    - name: EPHEMERAL_URL
      description: Public URL of the ephemeral deployment
    - name: NAMESPACE
      description: Namespace where the app was deployed
  workspaces:
    - name: source
  steps:
    - name: assert-prefix
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        NS="$(params.NAMESPACE)"
        PREFIX="$(params.NAMESPACE_PREFIX)"
        case "${NS}" in
          "${PREFIX}"*) ;;
          *)
            echo "namespace ${NS} is outside NAMESPACE_PREFIX=${PREFIX}" >&2
            exit 1
            ;;
        esac
    - name: helm-deploy
      image: alpine/helm:3.14.4
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        NS="$(params.NAMESPACE)"
        DIGEST="$(params.IMAGE_DIGEST)"
        IMAGE="$(params.IMAGE)"
        # Strip tag if present; digest pin is authoritative.
        REPO="${IMAGE%%:*}"
        helm upgrade --install "$(params.RELEASE_NAME)" ./sample-app/helm \
          --namespace "${NS}" \
          --create-namespace \
          --set image.repository="${REPO}" \
          --set image.digest="${DIGEST}" \
          --set image.tag="" \
          --wait --timeout 5m
        printf '%s' "${NS}" > "$(results.NAMESPACE.path)"
    - name: resolve-url
      image: quay.io/openshift/origin-cli:latest
      script: |
        #!/bin/bash
        set -euo pipefail
        NS="$(params.NAMESPACE)"
        HOST="$(oc -n "${NS}" get route sample-app -o jsonpath='{.spec.host}' 2>/dev/null || true)"
        if [[ -z "${HOST}" ]]; then
          # Fallback stub URL for clusters without Routes (documented for k8s-free dry runs).
          HOST="sample-app.${NS}.svc.cluster.local"
          URL="http://${HOST}:8080"
        else
          URL="https://${HOST}"
        fi
        printf '%s' "${URL}" | tee "$(results.EPHEMERAL_URL.path)"
